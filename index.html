<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Reader">
<link rel="manifest" href="manifest.json">
<title>Study Reader</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;background:#111827;color:#fff}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#fee2e2;color:#991b1b}.top{position:sticky;top:0;z-index:50;background:rgba(17,24,39,.97);color:#fff;padding:max(10px,env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top b{margin-right:auto}.wrap{max-width:1100px;margin:auto;padding:12px}.panel{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 5px #0001}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:120px;border:1px solid var(--line);border-radius:9px;padding:10px}.hidden{display:none!important}.status{font-size:.9rem;color:var(--muted)}#reader{background:#d1d5db;border-radius:12px;min-height:72vh;padding:10px;overflow:auto;-webkit-overflow-scrolling:touch}.page{position:relative;background:#fff;margin:0 auto 14px;box-shadow:0 1px 5px #0002}.page canvas{display:block;width:100%;height:auto}.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial}.word{position:absolute;color:transparent;white-space:pre;cursor:pointer;user-select:none;-webkit-user-select:none}.word:active{background:#facc1555}.epub-wrap{height:72vh;background:#fff}.epub-wrap iframe{border:0}.words{max-height:320px;overflow:auto;margin-top:8px}.wordrow{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:9px 0}.wordrow .meta{flex:1;min-width:0}.wordrow .meta div{overflow-wrap:anywhere}.popup{position:fixed;z-index:100;display:none;width:min(370px,calc(100vw - 20px));max-height:45vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #0004;padding:14px}.popup h3{margin:0 0 6px}.popup p{margin:6px 0;white-space:pre-wrap}.popup .label{font-size:.72rem;text-transform:uppercase;color:var(--muted);margin-top:8px}.drop{border:2px dashed #c7cbd1;border-radius:12px;padding:15px;text-align:center;color:var(--muted);margin-top:8px}.notice{padding:10px;border-radius:10px;background:#f3f4f6;color:#374151;font-size:.9rem}
@media(max-width:600px){.top{position:sticky}.top b{width:100%;margin:0 0 2px}button{padding:9px 10px}#reader{padding:6px}.page{margin-bottom:9px}}
</style>
</head>
<body>
<header class="top"><b>Study Reader</b><button id="bookBtn">Open book</button><input id="bookInput" type="file" accept="application/pdf,.pdf,application/epub+zip,.epub" hidden><button id="dbBtn">Word database</button><input id="dbInput" type="file" accept=".csv,.json,.txt" hidden></header>
<main class="wrap">
<section id="dbPanel" class="panel hidden">
<h2>Word database</h2>
<div class="toolbar"><input id="word" placeholder="Word"><input id="meaning" placeholder="Meaning"><input id="description" placeholder="Description"><button id="addWord">Add</button></div>
<div class="drop">For many words, import CSV or JSON.<br><small>CSV: word,meaning,description</small></div>
<p id="count" class="status"></p><div id="words" class="words"></div>
</section>
<section class="panel"><div id="bookName" class="status">No book opened.</div><div id="reader"></div></section>
</main>
<div id="popup" class="popup"><h3 id="pword"></h3><div class="label">Meaning</div><p id="pmeaning"></p><div class="label">Description</div><p id="pdesc"></p></div>
<script>
const DB='study-reader-db-v2', STORE='words'; let words=new Map(), pdfjsLib=null, currentBook=null;
const $=id=>document.getElementById(id);
function norm(s){return String(s||'').toLowerCase().normalize('NFKC').replace(/[“”‘’]/g,"'").replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}'-]+$/gu,'').trim()}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'word'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadWords(){const db=await openDB();const req=db.transaction(STORE,'readonly').objectStore(STORE).getAll();return new Promise((res,rej)=>{req.onsuccess=()=>{words=new Map(req.result.map(x=>[norm(x.word),x]));renderWords();res()};req.onerror=()=>rej(req.error)})}
async function putWord(x){const word=norm(x.word);if(!word)return;const item={word,meaning:String(x.meaning||''),description:String(x.description||'')};const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);tx.oncomplete=()=>{words.set(word,item);renderWords();res()};tx.onerror=()=>rej(tx.error)})}
async function deleteWord(w){const db=await openDB();const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(norm(w));tx.oncomplete=()=>{words.delete(norm(w));renderWords()}}
function renderWords(){$('count').textContent=`${words.size} words`;const box=$('words');box.innerHTML='';[...words.values()].sort((a,b)=>a.word.localeCompare(b.word)).forEach(x=>{const d=document.createElement('div');d.className='wordrow';const m=document.createElement('div');m.className='meta';const b=document.createElement('b');b.textContent=x.word;const a=document.createElement('div');a.textContent=x.meaning;const c=document.createElement('div');c.className='status';c.textContent=x.description;m.append(b,a,c);const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>deleteWord(x.word);d.append(m,del);box.appendChild(d)})}
function showPopup(x,e){$('pword').textContent=x.word;$('pmeaning').textContent=x.meaning||'—';$('pdesc').textContent=x.description||'—';const p=$('popup');p.style.display='block';let left=e.clientX+10,top=e.clientY+10;const w=Math.min(370,innerWidth-20);if(left+w>innerWidth)left=innerWidth-w-10;if(top+p.offsetHeight>innerHeight)top=Math.max(10,e.clientY-p.offsetHeight-10);p.style.left=Math.max(10,left)+'px';p.style.top=Math.max(10,top)+'px'}
function lookup(text,e){const key=norm(text);const x=words.get(key);if(x)showPopup(x,e)}
document.addEventListener('click',e=>{if(!$('popup').contains(e.target)&&!e.target.classList.contains('word'))$('popup').style.display='none'});
$('dbBtn').onclick=()=> $('dbPanel').classList.toggle('hidden');
$('addWord').onclick=async()=>{await putWord({word:$('word').value,meaning:$('meaning').value,description:$('description').value});$('word').value='';$('meaning').value='';$('description').value='';$('word').focus()};
$('dbInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();let rows=[];try{if(/\.json$/i.test(f.name)){const j=JSON.parse(t);rows=Array.isArray(j)?j:Object.values(j)}else{rows=t.split(/\r?\n/).filter(Boolean).map((line,i)=>{const p=line.split(',');return{word:p[0]?.trim(),meaning:p[1]?.trim()||'',description:p.slice(2).join(',').trim()||''}}).filter((x,i)=>i!==0||!/^word$/i.test(x.word||''))}}catch{alert('Invalid database file');return}for(const x of rows)if(x.word)await putWord({word:x.word,meaning:x.meaning||x.definition,description:x.description||x.explanation});e.target.value=''};
$('bookBtn').onclick=()=> $('bookInput').click();
$('bookInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('bookName').textContent=f.name;$('reader').innerHTML='';$('popup').style.display='none';try{if(/\.pdf$/i.test(f.name))await openPDF(f);else if(/\.epub$/i.test(f.name))await openEPUB(f);else alert('Please choose a PDF or EPUB.')}catch(err){console.error(err);alert('The book could not be opened on this device.')}};
async function openPDF(file){if(!pdfjsLib){pdfjsLib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs'}const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n);const vp=page.getViewport({scale:1.25});const box=document.createElement('div');box.className='page';box.style.width=vp.width+'px';box.style.height=vp.height+'px';const canvas=document.createElement('canvas');canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);box.appendChild(canvas);const layer=document.createElement('div');layer.className='textLayer';box.appendChild(layer);$('reader').appendChild(box);await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;const tc=await page.getTextContent();for(const item of tc.items){if(!item.str?.trim())continue;const tx=pdfjsLib.Util.transform(vp.transform,item.transform);const fontSize=Math.max(6,Math.hypot(tx[2],tx[3]));const fullWidth=(item.width||0)*vp.scale;const parts=item.str.split(/(\s+)/);let offset=0;for(const part of parts){if(!part)continue;const partWidth=fullWidth*(part.length/Math.max(item.str.length,1));if(part.trim()){const span=document.createElement('span');span.className='word';span.textContent=part;span.style.left=(tx[4]+offset)+'px';span.style.top=(tx[5]-fontSize)+'px';span.style.width=Math.max(partWidth,3)+'px';span.style.height=(fontSize*1.25)+'px';span.style.fontSize=fontSize+'px';span.addEventListener('click',ev=>lookup(part,ev));layer.appendChild(span)}offset+=partWidth}}}}
async function openEPUB(file){if(!window.ePub)await loadScript('https://unpkg.com/epubjs/dist/epub.min.js');const book=ePub(await file.arrayBuffer());const wrap=document.createElement('div');wrap.className='epub-wrap';$('reader').appendChild(wrap);const rendition=book.renderTo(wrap,{width:'100%',height:'100%'});await rendition.display();rendition.on('rendered',section=>{const contents=rendition.getContents();const content=contents[contents.length-1];const doc=content?.document;if(!doc)return;doc.addEventListener('click',e=>{const el=e.target;const text=el?.nodeType===3?el.textContent:el?.textContent||'';const tokens=text.split(/\s+/);if(tokens.length===1)lookup(tokens[0],e);else{const t=window.getSelection()?.toString()?.trim();if(t)lookup(t,e)}})});currentBook=book}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
loadWords();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
